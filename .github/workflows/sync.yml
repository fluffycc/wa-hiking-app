name: Sync Trail Data

on:
  schedule:
    - cron: '0 3,8,13,18,23 * * *'
  workflow_dispatch:
    inputs:
      sync_type:
        description: 'Which sync to run'
        required: true
        default: 'conditions'
        type: choice
        options: [conditions, osm, wadnr, waparks, wta, all]

jobs:
  sync-osm:
    name: Sync OSM Trails (manual legacy)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' &&
       inputs.sync_type == 'osm')
    steps:
      - name: Trigger OSM sync
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.SWA_API_URL }}/api/sync-osm?force=true&limit=250" \
            -H "x-sync-token: ${{ secrets.SYNC_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" --max-time 90)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
          echo "Status: $STATUS | Body: $BODY"
          [ "$STATUS" = "200" ] || exit 1

  sync-wadnr:
    name: Sync WA DNR Trails
    runs-on: ubuntu-latest
    if: |
      (
        (github.event_name == 'schedule' && github.event.schedule == '0 3,8,13,18,23 * * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.sync_type == 'wadnr') ||
        (github.event_name == 'workflow_dispatch' && inputs.sync_type == 'all')
      )
    steps:
      - name: Trigger WA DNR sync
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.SWA_API_URL }}/api/sync-wadnr" \
            -H "x-sync-token: ${{ secrets.SYNC_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" --max-time 300)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
          echo "Status: $STATUS | Body: $BODY"
          [ "$STATUS" = "200" ] || exit 1

  sync-waparks:
    name: Sync WA State Parks
    runs-on: ubuntu-latest
    needs: sync-wadnr
    if: |
      always() &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '0 3,8,13,18,23 * * *' && needs.sync-wadnr.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.sync_type == 'waparks') ||
        (github.event_name == 'workflow_dispatch' && inputs.sync_type == 'all' && needs.sync-wadnr.result == 'success')
      )
    steps:
      - name: Trigger WA Parks sync
        run: |
          for ATTEMPT in 1 2 3; do
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -X POST "${{ secrets.SWA_API_URL }}/api/sync-waparks" \
              -H "x-sync-token: ${{ secrets.SYNC_SECRET_TOKEN }}" \
              -H "Content-Type: application/json" --max-time 300)
            BODY=$(echo "$RESPONSE" | sed '$d')
            STATUS=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
            echo "Attempt $ATTEMPT Status: $STATUS | Body: $BODY"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep $((ATTEMPT * 20))
          done
          exit 1

  sync-wta:
    name: Sync WTA Enrichment
    runs-on: ubuntu-latest
    needs: sync-waparks
    if: |
      always() &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '0 3,8,13,18,23 * * *' && needs.sync-waparks.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.sync_type == 'wta') ||
        (github.event_name == 'workflow_dispatch' && inputs.sync_type == 'all' && needs.sync-waparks.result == 'success')
      )
    steps:
      - name: Trigger WTA enrichment
        run: |
          for PASS in 1 2 3; do
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -X POST "${{ secrets.SWA_API_URL }}/api/sync-wta?limit=20&index=true&seedLimit=8" \
              -H "x-sync-token: ${{ secrets.SYNC_SECRET_TOKEN }}" \
              -H "Content-Type: application/json" --max-time 90)
            BODY=$(echo "$RESPONSE" | sed '$d')
            STATUS=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
            echo "Pass $PASS Status: $STATUS | Body: $BODY"
            [ "$STATUS" = "200" ] || exit 1
          done

  sync-conditions:
    name: Sync Conditions (NOAA + WSDOT)
    runs-on: ubuntu-latest
    needs: sync-wta
    if: |
      always() &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '0 3,8,13,18,23 * * *' && needs.sync-wta.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.sync_type == 'conditions') ||
        (github.event_name == 'workflow_dispatch' && inputs.sync_type == 'all' && needs.sync-wta.result == 'success')
      )
    steps:
      - name: Trigger conditions sync
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.SWA_API_URL }}/api/sync-conditions" \
            -H "x-sync-token: ${{ secrets.SYNC_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" --max-time 600)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
          echo "Status: $STATUS | Body: $BODY"
          [ "$STATUS" = "200" ] || exit 1
