name: Sync Trail Data

on:
  schedule:
    - cron: '0 8 * * 1'
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sync_type:
        description: 'Which sync to run'
        required: true
        default: 'conditions'
        type: choice
        options: [conditions, osm, wadnr, waparks, all]

jobs:
  sync-conditions:
    name: Sync Conditions (NOAA + WSDOT)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.sync_type == 'conditions' || inputs.sync_type == 'all'))
    steps:
      - name: Trigger conditions sync
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.SWA_API_URL }}/api/sync-conditions" \
            -H "x-sync-token: ${{ secrets.SYNC_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" --max-time 600)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
          echo "Status: $STATUS | Body: $BODY"
          [ "$STATUS" = "200" ] || exit 1

  sync-osm:
    name: Sync OSM Trails
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.sync_type == 'osm' || inputs.sync_type == 'all'))
    steps:
      - name: Trigger OSM sync
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.SWA_API_URL }}/api/sync-osm" \
            -H "x-sync-token: ${{ secrets.SYNC_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" --max-time 600)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
          echo "Status: $STATUS | Body: $BODY"
          [ "$STATUS" = "200" ] || exit 1

  sync-wadnr:
    name: Sync WA DNR Trails
    runs-on: ubuntu-latest
    needs: sync-osm
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.sync_type == 'wadnr' || inputs.sync_type == 'all'))
    steps:
      - name: Trigger WA DNR sync
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.SWA_API_URL }}/api/sync-wadnr" \
            -H "x-sync-token: ${{ secrets.SYNC_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" --max-time 300)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
          echo "Status: $STATUS | Body: $BODY"
          [ "$STATUS" = "200" ] || exit 1

  sync-waparks:
    name: Sync WA State Parks
    runs-on: ubuntu-latest
    needs: sync-wadnr
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.sync_type == 'waparks' || inputs.sync_type == 'all'))
    steps:
      - name: Trigger WA Parks sync
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.SWA_API_URL }}/api/sync-waparks" \
            -H "x-sync-token: ${{ secrets.SYNC_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" --max-time 300)
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
          echo "Status: $STATUS | Body: $BODY"
          [ "$STATUS" = "200" ] || exit 1
